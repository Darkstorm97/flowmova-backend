spring:
  application:
    name: flowmova-backend
  servlet:
    multipart:
      max-file-size: ${FLOWMOVA_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${FLOWMOVA_MULTIPART_MAX_REQUEST_SIZE:6MB}
  datasource:
    url: ${FLOWMOVA_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flowmova}
    username: ${FLOWMOVA_DATASOURCE_USERNAME:flowmova}
    password: ${FLOWMOVA_DATASOURCE_PASSWORD:flowmova_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

flowmova:
  public-base-url: ${FLOWMOVA_PUBLIC_BASE_URL:http://localhost:3000}
  storage:
    local-root: ${FLOWMOVA_STORAGE_LOCAL_ROOT:.flowmova-storage}
    public-url-prefix: ${FLOWMOVA_STORAGE_PUBLIC_URL_PREFIX:http://localhost:8080/uploads}
    max-image-bytes: ${FLOWMOVA_STORAGE_MAX_IMAGE_BYTES:5242880}
  auth:
    jwt:
      issuer: ${FLOWMOVA_JWT_ISSUER:flowmova-backend}
      secret: ${FLOWMOVA_JWT_SECRET:flowmova-dev-secret-change-me-before-production-32}
      expires-in-seconds: ${FLOWMOVA_JWT_EXPIRES_IN_SECONDS:43200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
