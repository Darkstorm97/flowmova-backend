spring:
  application:
    name: flowmova-backend
  datasource:
    url: ${FLOWMOVA_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flowmova}
    username: ${FLOWMOVA_DATASOURCE_USERNAME:flowmova}
    password: ${FLOWMOVA_DATASOURCE_PASSWORD:flowmova_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
