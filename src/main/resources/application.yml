spring:
  application:
    name: flowmova-backend
  datasource:
    url: ${FLOWMOVA_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flowmova}
    username: ${FLOWMOVA_DATASOURCE_USERNAME:flowmova}
    password: ${FLOWMOVA_DATASOURCE_PASSWORD:flowmova_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

flowmova:
  auth:
    jwt:
      issuer: ${FLOWMOVA_JWT_ISSUER:flowmova-backend}
      secret: ${FLOWMOVA_JWT_SECRET:flowmova-dev-secret-change-me-before-production-32}
      expires-in-seconds: ${FLOWMOVA_JWT_EXPIRES_IN_SECONDS:43200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
